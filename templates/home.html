<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öğrenci Not Tahmin Sistemi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }

        .form-card {
            max-width: 650px;
            margin: 40px auto;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card form-card bg-white p-4 p-md-5">
            <h2 class="text-center mb-4 fw-bold text-primary">Matematik Notu Tahmini</h2>

            <form action="{{ url_for('predict_datapoint') }}" method="POST">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Cinsiyet (Gender)</label>
                    <select class="form-select" name="gender" required>
                        <option value="" disabled selected>Cinsiyet seçin</option>
                        <option value="male">Erkek (Male)</option>
                        <option value="female">Kadın (Female)</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Etnik Köken (Race/Ethnicity)</label>
                    <select class="form-select" name="race_ethnicity" required>
                        <option value="" disabled selected>Grup seçin</option>
                        <option value="group A">Group A</option>
                        <option value="group B">Group B</option>
                        <option value="group C">Group C</option>
                        <option value="group D">Group D</option>
                        <option value="group E">Group E</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Aile Eğitim Düzeyi (Parental Level of Education)</label>
                    <select class="form-select" name="parental_level_of_education" required>
                        <option value="" disabled selected>Eğitim düzeyi seçin</option>
                        <option value="associate's degree">Associate's Degree</option>
                        <option value="bachelor's degree">Bachelor's Degree</option>
                        <option value="high school">High School</option>
                        <option value="master's degree">Master's Degree</option>
                        <option value="some college">Some College</option>
                        <option value="some high school">Some High School</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Öğle Yemeği Tipi (Lunch)</label>
                    <select class="form-select" name="lunch" required>
                        <option value="" disabled selected>Yemek tipi seçin</option>
                        <option value="standard">Standard</option>
                        <option value="free/reduced">Free/Reduced</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Sınav Hazırlık Kursu (Test Preparation Course)</label>
                    <select class="form-select" name="test_preparation_course" required>
                        <option value="" disabled selected>Durum seçin</option>
                        <option value="none">None</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Okuma Notu (Reading Score)</label>
                        <input class="form-control" type="number" name="reading_score" min="0" max="100"
                            placeholder="0 - 100" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Yazma Notu (Writing Score)</label>
                        <input class="form-control" type="number" name="writing_score" min="0" max="100"
                            placeholder="0 - 100" required>
                    </div>
                </div>

                <div class="d-grid mt-4">
                    <button class="btn btn-primary btn-lg fw-bold" type="submit">Tahmin Et</button>
                </div>
            </form>

            {% if results %}
            <div class="alert alert-success text-center mt-4 mb-0" role="alert">
                <h4 class="alert-heading mb-1">Tahmin Edilen Matematik Notu</h4>
                <span class="display-6 fw-bold text-success">{{ results }}</span>
            </div>
            {% endif %}

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
